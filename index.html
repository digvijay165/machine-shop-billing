<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">F</div><div><div class="brand-name">ForgeFlow</div><div class="brand-sub">Workshop billing</div></div></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="main-nav">
        <button class="active" data-page="overview"><span class="nav-icon">◫</span><span class="nav-text">Overview</span></button>
        <button data-page="invoices"><span class="nav-icon">▤</span><span class="nav-text">Invoices</span></button>
        <button data-page="customers"><span class="nav-icon">♙</span><span class="nav-text">Customers</span></button>
        <button data-page="items"><span class="nav-icon">⚙</span><span class="nav-text">Parts &amp; services</span></button>
        <button data-page="settings"><span class="nav-icon">⌘</span><span class="nav-text">Business settings</span></button>
      </nav>
      <div class="sidebar-foot"><span class="local-dot"></span>Your bills are saved on this device.<br>Simple, private workshop billing.</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="top-left"><div><div class="eyebrow" id="top-eyebrow">WORKSPACE</div><div class="top-title" id="top-business">Your workshop</div></div></div><div class="top-actions"><button class="btn primary" data-action="new-invoice"><span>＋</span> New bill</button><div class="avatar" id="avatar">YW</div></div></header>
      <div class="content" id="view-root"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <section id="print-area" style="display:none"></section>
  <input id="restore-file" type="file" accept="application/json" hidden>
  <script>
    (()=>{
      const KEY='forgeflow_billing_v1';
      const defaults={settings:{businessName:'Your workshop',tagline:'Machine parts & service',phone:'',email:'',address:'',taxId:'',taxName:'GST',taxRate:18,currency:'INR'},catalog:[
        {id:'c1',kind:'Part',partNumber:'',name:'General machine part',brand:'',unit:'',details:[],rate:0,taxRate:18},
        {id:'c2',kind:'Part',partNumber:'',name:'Replacement bearing',brand:'',unit:'',details:[],rate:0,taxRate:18},
        {id:'c3',kind:'Service',partNumber:'',name:'Workshop labour',brand:'',unit:'',details:[],rate:0,taxRate:18},
        {id:'c4',kind:'Service',partNumber:'',name:'Machine inspection',brand:'',unit:'',details:[],rate:0,taxRate:18}
      ],invoices:[]};
      let db=load();let page='overview';let searchText='';let catalogSearch='';let invoiceFilter='all';let toastTimer;
      function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.settings?{...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings},catalog:d.catalog||[],invoices:d.invoices||[]}:structuredClone(defaults)}catch{return structuredClone(defaults)}}
      function save(){localStorage.setItem(KEY,JSON.stringify(db));updateBrand()}
      function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function money(n){const code=db.settings.currency||'INR';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:code,maximumFractionDigits:2}).format(Number(n)||0)}catch{return code+' '+(Number(n)||0).toFixed(2)}}
      function dateFmt(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return Number.isNaN(+d)?s:d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
      function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
      function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
      function num(v){return Math.max(0,Number(v)||0)}
      function totals(inv){const subtotal=(inv.items||[]).reduce((a,x)=>a+num(x.qty)*num(x.rate),0);const tax=(inv.items||[]).reduce((a,x)=>a+num(x.qty)*num(x.rate)*num(x.taxRate)/100,0);return{subtotal,tax,total:subtotal+tax}}
      function invNumber(){const y=new Date().getFullYear();const n=db.invoices.filter(x=>String(x.number||'').startsWith('INV-'+y+'-')).length+1;return 'INV-'+y+'-'+String(n).padStart(3,'0')}
      function state(inv){if(inv.paid)return 'Paid';return inv.dueDate&&inv.dueDate<today()?'Overdue':'Open'}
      function badge(s){return `<span class="status ${s.toLowerCase()}">${s}</span>`}
      function updateBrand(){const s=db.settings;document.title=(s.businessName||'Your workshop')+' — ForgeFlow';document.getElementById('top-business').textContent=s.businessName||'Your workshop';document.getElementById('avatar').textContent=(s.businessName||'YW').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
      function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2600)}
      function pageTitle(){return {overview:['Overview','A clear view of your workshop billing'],invoices:['Invoices','Create, find and follow up on customer bills'],customers:['Customers','Your customer list, built from your bills'],items:['Parts & services','Keep commonly billed work ready to add'],settings:['Business settings','Set the details that appear on every bill']}[page]}
      function render(){updateBrand();document.querySelectorAll('#main-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const [title,sub]=pageTitle();document.getElementById('top-eyebrow').textContent=title.toUpperCase();const root=document.getElementById('view-root');root.innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${page==='overview'?'<button class="btn primary" data-action="new-invoice">＋ Create a bill</button>':''}</div>${page==='overview'?overview():page==='invoices'?invoicesView():page==='customers'?customersView():page==='items'?itemsView():settingsView()}`;}
      function overview(){const list=[...db.invoices].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const month=today().slice(0,7);const paid=db.invoices.filter(x=>x.paid&&x.date?.slice(0,7)===month).reduce((a,x)=>a+totals(x).total,0);const outstanding=db.invoices.filter(x=>!x.paid).reduce((a,x)=>a+totals(x).total,0);const customers=new Set(db.invoices.map(x=>(x.customerName||'').trim().toLowerCase()).filter(Boolean)).size;
        return `<div class="metrics"><div class="metric"><div class="metric-label">Outstanding <span class="metric-icon">◷</span></div><div class="metric-value">${money(outstanding)}</div><div class="metric-note">${db.invoices.filter(x=>!x.paid).length} unpaid bill${db.invoices.filter(x=>!x.paid).length===1?'':'s'}</div></div><div class="metric"><div class="metric-label">Collected this month <span class="metric-icon">↗</span></div><div class="metric-value">${money(paid)}</div><div class="metric-note">Paid invoices dated this month</div></div><div class="metric"><div class="metric-label">Bills created <span class="metric-icon">▤</span></div><div class="metric-value">${db.invoices.length}</div><div class="metric-note">All time on this device</div></div><div class="metric"><div class="metric-label">Customers <span class="metric-icon">♙</span></div><div class="metric-value">${customers}</div><div class="metric-note">From your invoice history</div></div></div>
          <div class="grid-two"><section class="card"><div class="card-head"><div><div class="card-title">Billing activity</div><div class="card-note">Total billed over the last six months</div></div><span class="item-pill">6 MONTHS</span></div>${chart()}<div class="chart-legend"><span><i class="legend-dot"></i>Open</span><span><i class="legend-dot paid"></i>Paid</span></div></section><section class="card"><div class="card-head"><div><div class="card-title">Quick actions</div><div class="card-note">Common workshop tasks</div></div></div><div class="quick-actions"><a class="quick-action" href="#" data-action="new-invoice"><span class="quick-icon">＋</span><span><b>Create a bill</b><small>Parts, labour or both</small></span></a><a class="quick-action" href="#" data-page-link="items"><span class="quick-icon">⚙</span><span><b>Add a part or service</b><small>Build your reusable list</small></span></a><a class="quick-action" href="#" data-page-link="settings"><span class="quick-icon">⌘</span><span><b>Set up your business</b><small>Contact and tax details</small></span></a></div></section></div>
          <section class="card list-card"><div class="card-head"><div><div class="card-title">Recent bills</div><div class="card-note">Your latest customer invoices</div></div><button class="btn small" data-page-link="invoices">View all invoices →</button></div>${list.length?invoiceTable(list.slice(0,5),false):emptyBlock('No bills yet','Create your first bill to start tracking parts, service work and payments.','Create your first bill')}</section>`}
      function chart(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString(undefined,{month:'short'})})}const vals=months.map(m=>{const xs=db.invoices.filter(i=>i.date?.slice(0,7)===m.key);return{label:m.label,open:xs.filter(x=>!x.paid).reduce((a,x)=>a+totals(x).total,0),paid:xs.filter(x=>x.paid).reduce((a,x)=>a+totals(x).total,0)}});const max=Math.max(1,...vals.map(x=>x.open+x.paid));return `<div class="chart">${vals.map(v=>`<div class="chart-col"><div class="bar-wrap" title="${esc(v.label)} · ${money(v.open+v.paid)}"><div class="bar" style="height:${Math.max(2,v.open/max*100)}%"></div><div class="bar paid" style="height:${Math.max(2,v.paid/max*100)}%"></div></div><span class="chart-label">${esc(v.label)}</span></div>`).join('')}</div>`}
      function invoiceTable(list,showActions=true){return `<div class="table-wrap"><table><thead><tr><th>INVOICE</th><th>CUSTOMER</th><th>DATE</th><th>STATUS</th><th class="right">AMOUNT</th>${showActions?'<th></th>':''}</tr></thead><tbody>${list.map(i=>`<tr data-open="${esc(i.id)}"><td><span class="invoice-no">${esc(i.number)}</span></td><td><div class="customer-cell">${esc(i.customerName||'Unnamed customer')}</div><div class="subcell">${esc(i.machineRef||'')}</div></td><td>${dateFmt(i.date)}</td><td>${badge(state(i))}</td><td class="right"><b>${money(totals(i).total)}</b></td>${showActions?'<td class="right"><button class="btn small" data-open-btn="'+esc(i.id)+'">View</button></td>':''}</tr>`).join('')}</tbody></table></div>`}
      function emptyBlock(title,text,button){return `<div class="empty"><div class="empty-icon">▤</div><h3>${title}</h3><p>${text}</p><button class="btn primary" data-action="new-invoice">＋ ${button}</button></div>`}
      function invoicesView(){let list=[...db.invoices].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(searchText){const q=searchText.toLowerCase();list=list.filter(i=>[i.number,i.customerName,i.customerPhone,i.machineRef].some(x=>(x||'').toLowerCase().includes(q)))}if(invoiceFilter!=='all')list=list.filter(i=>state(i).toLowerCase()===invoiceFilter);return `<div class="toolbar"><div class="search"><input id="invoice-search" class="field" placeholder="Search invoice or customer…" value="${esc(searchText)}"></div><select id="invoice-filter" class="field" style="width:auto;min-width:140px"><option value="all">All statuses</option><option value="open">Open</option><option value="overdue">Overdue</option><option value="paid">Paid</option></select><span style="flex:1"></span><button class="btn" data-action="export-csv">↓ Export CSV</button><button class="btn primary" data-action="new-invoice">＋ New bill</button></div><section class="card list-card" style="margin-top:0">${list.length?invoiceTable(list,true):db.invoices.length?`<div class="empty"><div class="empty-icon">⌕</div><h3>No matching invoices</h3><p>Try another search or status filter.</p></div>`:emptyBlock('Your invoices will show here','Create a bill for parts or service, then print it or send it to your customer.','Create a bill')}</section>`}
      function customerRows(){const map=new Map();db.invoices.forEach(i=>{const key=(i.customerName||'Unnamed customer').trim().toLowerCase();let c=map.get(key);if(!c){c={name:i.customerName||'Unnamed customer',phone:i.customerPhone||'',email:i.customerEmail||'',count:0,billed:0,open:0,last:i.date};map.set(key,c)}c.count++;c.billed+=totals(i).total;if(!i.paid)c.open+=totals(i).total;if(i.date>c.last)c.last=i.date});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
      function customersView(){const cs=customerRows();return `<div class="toolbar"><div class="search"><input id="customer-search" class="field" placeholder="Search customers…" value="${esc(searchText)}"></div><span class="muted" style="font-size:11px">${cs.length} customer${cs.length===1?'':'s'}</span></div><section class="card list-card" style="margin-top:0">${cs.length?`<div class="table-wrap"><table><thead><tr><th>CUSTOMER</th><th>CONTACT</th><th>BILLS</th><th>LAST BILL</th><th class="right">OUTSTANDING</th></tr></thead><tbody>${cs.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(searchText.toLowerCase())).map(c=>`<tr><td><div class="customer-name-wrap"><span class="customer-avatar">${esc(c.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><b>${esc(c.name)}</b></div></td><td>${esc(c.phone||c.email||'—')}<div class="subcell">${esc(c.email&&c.phone?c.email:'')}</div></td><td>${c.count}</td><td>${dateFmt(c.last)}</td><td class="right"><b>${money(c.open)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">♙</div><h3>Customer list starts with your first bill</h3><p>Customer details are remembered from invoices on this device, so repeat billing is quicker.</p><button class="btn primary" data-action="new-invoice">＋ Create a bill</button></div>`}</section>`}
      function itemsView(){
        const query=catalogSearch.trim().toLowerCase();
        const filtered=db.catalog.filter(c=>[c.partNumber,c.name,c.brand,c.unit,c.kind,...(c.details||[]).map(d=>d.join(': '))].join(' ').toLowerCase().includes(query));
        const shown=filtered.slice(0,200);
        return `<div class="toolbar"><div class="search"><input id="catalog-search" class="field" placeholder="Find by part number, name, brand…" value="${esc(catalogSearch)}"></div><button class="btn" data-action="import-catalog">↑ Import Excel / CSV</button><input id="catalog-import-file" type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden><span class="muted" style="font-size:11px">${filtered.length} item${filtered.length===1?'':'s'}</span></div><div class="grid-two" style="grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);align-items:start"><section class="card" style="padding:0;overflow:hidden"><div class="card-head" style="padding:18px 19px 0"><div><div class="card-title">Parts &amp; services list</div><div class="card-note">Search by part number or any imported field. Choose a saved item on a bill to fill its details.</div></div></div>${shown.length?`<div class="table-wrap"><table><thead><tr><th>PART NUMBER</th><th>DESCRIPTION</th><th>TYPE</th><th>UNIT PRICE</th><th>TAX</th><th></th></tr></thead><tbody>${shown.map(c=>`<tr><td><b>${esc(c.partNumber||'—')}</b></td><td><b>${esc(c.name)}</b><div class="subcell">${esc([c.brand,c.unit].filter(Boolean).join(' · '))}</div></td><td><span class="item-pill">${esc(c.kind||'Part')}</span></td><td>${money(c.rate)}</td><td>${num(c.taxRate)}%</td><td class="right"><button class="btn small danger" data-delete-item="${esc(c.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>${filtered.length>200?'<div class="helper" style="padding:10px 19px">Showing the first 200 matches. Refine your search to see a specific item.</div>':''}`:`<div class="empty"><div class="empty-icon">⚙</div><h3>${query?'No matching parts or services':'Your saved items will appear here'}</h3><p>${query?'Try another part number, description, or spreadsheet field.':'Import your Excel item list or add your most-used parts and services.'}</p>${query?'':'<button class="btn" data-action="import-catalog">↑ Import Excel / CSV</button>'}</div>`}</section><section class="card"><div class="card-title">Add an item</div><div class="card-note">Use the part number you look up in your workshop. Prices can be changed on a bill.</div><form id="item-form" style="margin-top:16px"><div class="form-grid"><div class="field-group"><label>Part number / code</label><input name="partNumber" class="field" placeholder="e.g. BRG-6204"></div><div class="field-group"><label>Item name / description *</label><input name="name" class="field" required placeholder="e.g. Deep groove ball bearing"></div><div class="field-group"><label>Brand</label><input name="brand" class="field" placeholder="Optional"></div><div class="field-group"><label>Unit</label><input name="unit" class="field" placeholder="e.g. piece, hour"></div><div class="field-group"><label>Type</label><select name="kind" class="field"><option>Part</option><option>Service</option></select></div><div class="field-group"><label>Unit price (${esc(db.settings.currency)})</label><input name="rate" class="field" type="number" min="0" step="0.01" value="0"></div><div class="field-group"><label>${esc(db.settings.taxName)} rate</label><input name="taxRate" class="field" type="number" min="0" step="0.01" value="${num(db.settings.taxRate)}"></div></div><button class="btn primary" style="margin-top:14px">＋ Save item</button></form><div class="hint-box">Excel columns such as Part Number, Description, Brand, Unit, Price and Tax are recognized. Extra columns stay searchable. Import runs in this browser; the file is not uploaded.</div></section></div>`
      }      function settingsView(){const s=db.settings;return `<section class="card setting-card"><div class="card-title">Business details</div><div class="card-note">These details appear on the bills you print and share.</div><form id="settings-form"><div class="form-grid" style="margin-top:16px"><div class="field-group"><label>Business name</label><input class="field" name="businessName" value="${esc(s.businessName)}" placeholder="Your workshop" required></div><div class="field-group"><label>Short description</label><input class="field" name="tagline" value="${esc(s.tagline)}" placeholder="Machine parts & service"></div><div class="field-group"><label>Phone</label><input class="field" name="phone" value="${esc(s.phone)}" placeholder="Phone number"></div><div class="field-group"><label>Email</label><input class="field" name="email" type="email" value="${esc(s.email)}" placeholder="you@workshop.com"></div><div class="field-group wide"><label>Business address</label><textarea class="field" name="address" rows="2" placeholder="Street, city, postal code">${esc(s.address)}</textarea></div><div class="field-group"><label>Tax registration number (optional)</label><input class="field" name="taxId" value="${esc(s.taxId)}" placeholder="GSTIN or other tax ID"></div><div class="field-group"><label>Tax name</label><input class="field" name="taxName" value="${esc(s.taxName)}" placeholder="GST"></div><div class="field-group"><label>Default tax rate (%)</label><input class="field" name="taxRate" type="number" min="0" step="0.01" value="${num(s.taxRate)}"></div><div class="field-group"><label>Currency code</label><input class="field" name="currency" maxlength="3" value="${esc(s.currency)}" placeholder="INR"></div></div><button class="btn primary" style="margin-top:15px">Save business details</button></form><div class="hint-box">Tax settings are defaults for new bill lines. Check that your tax details and rates match your local requirements.</div></section><section class="card setting-card"><div class="card-title">Your data</div><div class="card-note">Bills and settings stay in this browser on this device. Export a backup before switching devices.</div><div class="setting-actions"><button class="btn" data-action="backup">↓ Download backup</button><button class="btn" data-action="restore">↑ Restore backup</button><button class="btn danger" data-action="clear-data">Clear all local data</button></div></section>`}
      function openModal(html,narrow=false){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-layer" data-close-layer><div class="modal ${narrow?'narrow':''}" role="dialog" aria-modal="true">${html}</div></div>`;root.querySelector('.modal-layer').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()})}
      function closeModal(){document.getElementById('modal-root').innerHTML=''}
      function showBuilder(id=null){const old=id?db.invoices.find(x=>x.id===id):null;const inv=old||{number:invNumber(),date:today(),dueDate:new Date(Date.now()+14*86400000).toISOString().slice(0,10),items:[{id:uid(),kind:'Part',description:'',qty:1,rate:0,taxRate:num(db.settings.taxRate)}]};const items=inv.items.map(x=>lineRow(x)).join('');openModal(`<div class="modal-head"><div><h2>${old?'Edit bill':'Create a bill'}</h2><p>${esc(inv.number)} · Add parts, service work, or both</p></div><button class="close" data-close aria-label="Close">×</button></div><form id="invoice-form" data-id="${old?esc(old.id):''}"><div class="modal-body"><div class="section-title">Customer &amp; machine</div><div class="form-grid three"><div class="field-group"><label>Customer name *</label><input class="field" name="customerName" required value="${esc(inv.customerName||'')}" placeholder="Customer or company"></div><div class="field-group"><label>Phone</label><input class="field" name="customerPhone" value="${esc(inv.customerPhone||'')}" placeholder="Phone number"></div><div class="field-group"><label>Email</label><input class="field" name="customerEmail" type="email" value="${esc(inv.customerEmail||'')}" placeholder="name@example.com"></div><div class="field-group"><label>Machine / asset</label><input class="field" name="machineRef" value="${esc(inv.machineRef||'')}" placeholder="Machine model or serial number"></div><div class="field-group"><label>Bill date</label><input class="field" type="date" name="date" value="${esc(inv.date)}"></div><div class="field-group"><label>Due date</label><input class="field" type="date" name="dueDate" value="${esc(inv.dueDate||'')}"></div><div class="field-group wide"><label>Customer address (optional)</label><input class="field" name="customerAddress" value="${esc(inv.customerAddress||'')}" placeholder="Billing address"></div></div><div class="line-head"><b>Bill items</b><button type="button" class="btn small" data-add-line>＋ Add line</button></div><div class="line-header"><span>TYPE</span><span>PART OR SERVICE</span><span>QTY</span><span>UNIT PRICE</span><span>TAX %</span><span></span></div><div id="line-items">${items}</div><div id="invoice-totals"></div><hr class="divider"><div class="field-group"><label>Notes or payment terms</label><textarea class="field" name="notes" rows="2" placeholder="Payment method, warranty, or a note for your customer">${esc(inv.notes||'')}</textarea></div><div class="helper">Bill number is assigned automatically. You can edit a bill later and mark it paid from its details.</div></div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><div style="display:flex;gap:8px"><button type="submit" class="btn primary">${old?'Save changes':'Save bill'}</button></div></div></form>`);

      function catalogLabel(c){return `${c.partNumber?c.partNumber+' — ':''}${c.name}${c.brand?' · '+c.brand:''}`}
      function catalogSearchValue(c){return `${catalogLabel(c)} ${(c.details||[]).map(d=>Array.isArray(d)?d.join(' '):String(d)).join(' ')}`.trim()}
      function lineRow(x={}){const kind=x.kind||'Part';const id=x.id||uid();const chosen=db.catalog.find(c=>c.id===x.catalogId);const value=chosen?catalogLabel(chosen):(x.partNumber?x.partNumber+' — ':'')+(x.description||'');const opts=db.catalog.map(c=>`<option value="${esc(catalogSearchValue(c))}" label="${esc([c.unit,money(c.rate)].filter(Boolean).join(' · '))}"></option>`).join('');return `<div class="line-row" data-line="${esc(id)}"><select class="line-kind" aria-label="Type"><option ${kind==='Part'?'selected':''}>Part</option><option ${kind==='Service'?'selected':''}>Service</option></select><div class="description"><input class="product-pick field" list="catalog-options-${esc(id)}" aria-label="Find by part number or description" placeholder="Search part number or name…" value="${esc(value)}"><datalist id="catalog-options-${esc(id)}">${opts}</datalist><input class="field desc-input" style="margin-top:5px" placeholder="Invoice description" value="${esc(x.description||'')}"></div><input class="field qty" type="number" min="0.01" step="any" value="${esc(x.qty??1)}" aria-label="Quantity"><input class="field rate" type="number" min="0" step="0.01" value="${esc(x.rate??0)}" aria-label="Unit price"><input class="field tax" type="number" min="0" step="0.01" value="${esc(x.taxRate??num(db.settings.taxRate))}" aria-label="Tax percent"><button type="button" class="remove" title="Remove line" aria-label="Remove line">×</button></div>`}      function syncKind(row){const k=row.querySelector('.line-kind').value;row.dataset.kind=k}
      function refreshTotals(){const rows=[...document.querySelectorAll('#line-items .line-row')];let subtotal=0,tax=0;rows.forEach(r=>{const line=num(r.querySelector('.qty').value)*num(r.querySelector('.rate').value);subtotal+=line;tax+=line*num(r.querySelector('.tax').value)/100});const el=document.getElementById('invoice-totals');if(el)el.innerHTML=`<div class="totals"><div class="total-line"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="total-line"><span>Tax</span><b>${money(tax)}</b></div><div class="total-line final"><span>Total</span><span>${money(subtotal+tax)}</span></div></div>`}
      function findCatalogItem(value){const q=String(value||'').trim().toLowerCase();if(!q)return null;return db.catalog.find(c=>catalogSearchValue(c).toLowerCase()===q||catalogLabel(c).toLowerCase()===q||String(c.partNumber||'').trim().toLowerCase()===q||String(c.name||'').trim().toLowerCase()===q)||null}      function collectLines(){return [...document.querySelectorAll('#line-items .line-row')].map(r=>{const c=findCatalogItem(r.querySelector('.product-pick').value);return{id:r.dataset.line,kind:r.querySelector('.line-kind').value,description:c?catalogLabel(c):r.querySelector('.desc-input').value.trim(),partNumber:c?.partNumber||'',qty:num(r.querySelector('.qty').value),rate:num(r.querySelector('.rate').value),taxRate:num(r.querySelector('.tax').value),catalogId:c?.id||''}}).filter(x=>x.description)}      function showDetail(id){const inv=db.invoices.find(x=>x.id===id);if(!inv)return;const t=totals(inv);const items=(inv.items||[]).map(x=>`<tr><td>${esc(x.description)}<div class="subcell">${esc(x.kind)}</div></td><td>${num(x.qty)}</td><td>${money(x.rate)}</td><td>${money(num(x.qty)*num(x.rate))}</td></tr>`).join('');openModal(`<div class="modal-head"><div><h2>${esc(inv.number)}</h2><p>${esc(inv.customerName||'Unnamed customer')} · ${dateFmt(inv.date)}</p></div><button class="close" data-close aria-label="Close">×</button></div><div class="modal-body"><div class="detail-top"><div><div style="margin-bottom:9px">${badge(state(inv))}</div><b>${esc(inv.machineRef||'Machine / asset not specified')}</b><div class="subcell" style="margin-top:5px">Due ${dateFmt(inv.dueDate)}</div></div><div style="text-align:right"><div class="muted" style="font-size:10px">TOTAL DUE</div><div class="detail-total">${money(t.total)}</div></div></div><div class="form-grid" style="margin-top:18px"><div><label>BILLED TO</label><b>${esc(inv.customerName||'—')}</b><div class="subcell">${esc(inv.customerPhone||'')}${inv.customerEmail?' · '+esc(inv.customerEmail):''}</div><div class="subcell">${esc(inv.customerAddress||'')}</div></div><div><label>FROM</label><b>${esc(db.settings.businessName)}</b><div class="subcell">${esc(db.settings.phone||'')}${db.settings.email?' · '+esc(db.settings.email):''}</div></div></div><div class="table-wrap detail-table"><table><thead><tr><th>DESCRIPTION</th><th>QTY</th><th>UNIT PRICE</th><th>AMOUNT</th></tr></thead><tbody>${items}</tbody></table></div><div class="totals"><div class="total-line"><span>Subtotal</span><b>${money(t.subtotal)}</b></div><div class="total-line"><span>${esc(db.settings.taxName)} total</span><b>${money(t.tax)}</b></div><div class="total-line final"><span>Total</span><span>${money(t.total)}</span></div></div>${inv.notes?`<hr class="divider"><label>NOTE</label><div style="font-size:12px">${esc(inv.notes)}</div>`:''}<div class="hint-box">To send a PDF, print this bill and choose “Save as PDF”, then attach it to your email or message.</div></div><div class="modal-foot"><button class="btn danger" data-delete-invoice="${esc(inv.id)}">Delete bill</button><div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" data-share="email" data-id="${esc(inv.id)}">Email</button><button class="btn" data-share="whatsapp" data-id="${esc(inv.id)}">WhatsApp</button><button class="btn" data-action="print" data-id="${esc(inv.id)}">Print / PDF</button><button class="btn" data-edit="${esc(inv.id)}">Edit</button>${inv.paid?'':'<button class="btn primary" data-mark-paid="'+esc(inv.id)+'">Mark paid</button>'}</div></div>`)}
      function printInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const t=totals(i);document.getElementById('print-area').innerHTML=`<div class="print-head"><div><div class="print-brand">${esc(db.settings.businessName)}</div><div>${esc(db.settings.tagline||'')}</div><div>${esc(db.settings.address||'')}</div><div>${esc(db.settings.phone||'')}${db.settings.email?' · '+esc(db.settings.email):''}</div>${db.settings.taxId?`<div>${esc(db.settings.taxName)} ID: ${esc(db.settings.taxId)}</div>`:''}</div><div class="print-title"><strong>INVOICE</strong><div>${esc(i.number)}</div><div>Date: ${dateFmt(i.date)}</div><div>Due: ${dateFmt(i.dueDate)}</div><div>${state(i)}</div></div></div><div class="print-meta"><div><div class="print-box-title">Bill to</div><b>${esc(i.customerName||'')}</b><div>${esc(i.customerAddress||'')}</div><div>${esc(i.customerPhone||'')}</div><div>${esc(i.customerEmail||'')}</div></div><div><div class="print-box-title">Machine / asset</div><b>${esc(i.machineRef||'—')}</b></div></div><table class="print-items"><thead><tr><th>Type</th><th>Description</th><th>Qty</th><th>Unit price</th><th>Tax</th><th>Amount</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.kind)}</td><td>${esc(x.description)}</td><td>${num(x.qty)}</td><td>${money(x.rate)}</td><td>${num(x.taxRate)}%</td><td>${money(num(x.qty)*num(x.rate))}</td></tr>`).join('')}</tbody></table><div class="print-bottom"><div class="print-notes"><div class="print-box-title">Notes / payment terms</div><div>${esc(i.notes||'Thank you for your business.')}</div></div><div class="print-totals"><div class="print-total"><span>Subtotal</span><b>${money(t.subtotal)}</b></div><div class="print-total"><span>${esc(db.settings.taxName)}</span><b>${money(t.tax)}</b></div><div class="print-total grand"><span>Total</span><span>${money(t.total)}</span></div></div></div><div class="print-footer">${esc(db.settings.businessName)} · Thank you for your business</div>`;setTimeout(()=>window.print(),50)}
      function invoiceMessage(i){const t=totals(i);return `Invoice ${i.number} from ${db.settings.businessName}\nCustomer: ${i.customerName}\nMachine: ${i.machineRef||'—'}\nDate: ${dateFmt(i.date)} · Due: ${dateFmt(i.dueDate)}\nAmount due: ${money(t.total)}\n\n${i.notes||'Please see attached bill for details.'}\n\nTo include the full bill, attach the PDF generated using Print / PDF.`}
      function shareInvoice(id,method){const i=db.invoices.find(x=>x.id===id);if(!i)return;const text=invoiceMessage(i);if(method==='email'){const subject=encodeURIComponent(`Invoice ${i.number} from ${db.settings.businessName}`);const body=encodeURIComponent(text);location.href=`mailto:${encodeURIComponent(i.customerEmail||'')}?subject=${subject}&body=${body}`;toast('Email draft opened — attach the bill PDF before sending.')}else if(method==='whatsapp'){window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank','noopener');toast('WhatsApp opened with the bill summary.')}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Bill summary copied.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
      function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('Bill summary copied.')}
      function exportCSV(){const rows=[['Invoice','Customer','Phone','Email','Machine','Date','Due date','Status','Subtotal','Tax','Total','Currency']];db.invoices.forEach(i=>{const t=totals(i);rows.push([i.number,i.customerName,i.customerPhone,i.customerEmail,i.machineRef,i.date,i.dueDate,state(i),t.subtotal.toFixed(2),t.tax.toFixed(2),t.total.toFixed(2),db.settings.currency])});const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('forgeflow-invoices.csv',csv,'text/csv');toast('Invoice list downloaded.')}
      function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
      function parseDelimited(text){const sample=text.slice(0,5000);let delimiter=',';let best=-1;for(const candidate of [',',';','\t']){let count=0,quoted=false;for(let i=0;i<sample.length&&sample[i]!=='\n'&&sample[i]!=='\r';i++){if(sample[i]==='"'&&sample[i+1]==='"'){i++;continue}if(sample[i]==='"')quoted=!quoted;else if(sample[i]===candidate&&!quoted)count++}if(count>best){best=count;delimiter=candidate}}const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);row=[];field=''}else field+=ch}row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);return rows}
      function parseXml(text){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('That Excel file has an invalid worksheet.');return doc}
      async function readXlsx(file){const bytes=new Uint8Array(await file.arrayBuffer());const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);let eocd=-1;for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65557);p--){if(view.getUint32(p,true)===0x06054b50){eocd=p;break}}if(eocd<0)throw new Error('Could not read this Excel workbook. Save it as .xlsx and try again.');const entries=view.getUint16(eocd+10,true);let pos=view.getUint32(eocd+16,true);const decoder=new TextDecoder();const zip=new Map();for(let n=0;n<entries;n++){if(view.getUint32(pos,true)!==0x02014b50)throw new Error('The Excel workbook directory is not readable.');const method=view.getUint16(pos+10,true),compressedSize=view.getUint32(pos+20,true),nameLen=view.getUint16(pos+28,true),extraLen=view.getUint16(pos+30,true),commentLen=view.getUint16(pos+32,true),localOffset=view.getUint32(pos+42,true);const name=decoder.decode(bytes.slice(pos+46,pos+46+nameLen));zip.set(name,{method,compressedSize,localOffset});pos+=46+nameLen+extraLen+commentLen}async function entry(name){const fileEntry=zip.get(name);if(!fileEntry)return null;const p=fileEntry.localOffset;if(view.getUint32(p,true)!==0x04034b50)throw new Error('An Excel worksheet could not be opened.');const dataAt=p+30+view.getUint16(p+26,true)+view.getUint16(p+28,true);const packed=bytes.slice(dataAt,dataAt+fileEntry.compressedSize);if(fileEntry.method===0)return packed;if(fileEntry.method!==8)throw new Error('This Excel file uses an unsupported compression method.');if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot unpack .xlsx files. Open the file in a recent Chrome or Edge browser, or save it as .csv.');try{return new Uint8Array(await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch{throw new Error('Could not unpack the Excel file. Try saving it again as .xlsx or .csv.')}}
        const text=async name=>{const b=await entry(name);return b?decoder.decode(b):null};let shared=[];const sharedText=await text('xl/sharedStrings.xml');if(sharedText){const doc=parseXml(sharedText);shared=[...doc.getElementsByTagNameNS('*','si')].map(si=>[...si.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join(''))}let sheetPath='xl/worksheets/sheet1.xml';const workbookText=await text('xl/workbook.xml');if(workbookText){const book=parseXml(workbookText);const first=book.getElementsByTagNameNS('*','sheet')[0];if(first){const relId=first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||first.getAttribute('r:id');const relText=await text('xl/_rels/workbook.xml.rels');if(relText&&relId){const relDoc=parseXml(relText);const rel=[...relDoc.getElementsByTagNameNS('*','Relationship')].find(x=>x.getAttribute('Id')===relId);if(rel){const target=rel.getAttribute('Target');sheetPath=target.startsWith('/')?target.slice(1):('xl/'+target).replace(/\/\.\//g,'/');const parts=[];sheetPath.split('/').forEach(x=>{if(x==='..')parts.pop();else if(x!=='.')parts.push(x)});sheetPath=parts.join('/')}}}}const sheetText=await text(sheetPath);if(!sheetText)throw new Error('No worksheet was found in that Excel file.');const doc=parseXml(sheetText);const rows=[];for(const rowEl of doc.getElementsByTagNameNS('*','row')){const row=[];for(const cell of rowEl.getElementsByTagNameNS('*','c')){const ref=cell.getAttribute('r')||'A1';const letters=(ref.match(/[A-Z]+/i)||['A'])[0].toUpperCase();let col=0;for(const ch of letters)col=col*26+ch.charCodeAt(0)-64;col--;const type=cell.getAttribute('t');let val='';if(type==='inlineStr'){val=[...cell.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join('')}else{const v=cell.getElementsByTagNameNS('*','v')[0];val=v?.textContent||'';if(type==='s')val=shared[Number(val)]??'';else if(type==='b')val=val==='1'?'TRUE':'FALSE'}row[col]=val}rows.push(row.map(x=>x??''))}return rows}
      function headerKey(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
      function parseAmount(v,fallback=0){if(v===undefined||v===null||String(v).trim()==='')return fallback;const value=Number(String(v).replace(/,/g,'').replace(/[^0-9.+-]/g,''));return Number.isFinite(value)?Math.max(0,value):fallback}
      async function importCatalogFile(file){if(file.size>25*1024*1024)throw new Error('For a faster import, choose a file smaller than 25 MB.');const ext=file.name.split('.').pop().toLowerCase();let rows;if(ext==='csv')rows=parseDelimited(await file.text());else if(ext==='xlsx')rows=await readXlsx(file);else throw new Error('Please choose an .xlsx Excel file or a .csv file.');const headerRow=rows.findIndex(r=>r.some(v=>String(v||'').trim()));if(headerRow<0)throw new Error('This spreadsheet is empty.');const headers=rows[headerRow].map(v=>String(v||'').trim());const find=aliases=>headers.findIndex(h=>aliases.includes(headerKey(h)));const pCol=find(['partnumber','partno','partnum','sku','itemcode','productcode','stockcode','materialcode','code']);const nCol=find(['description','itemdescription','partdescription','productname','itemname','partname','name','product','item']);const brandCol=find(['brand','manufacturer','make']);const unitCol=find(['unit','uom','quantityunit']);const kindCol=find(['type','category','itemtype']);const rateCol=find(['unitprice','sellingprice','salesprice','rate','price']);const taxCol=find(['taxrate','gstpercent','taxpercent','gst','tax']);if(pCol<0&&nCol<0)throw new Error('Add a header named Part Number, SKU, Item Code, Name or Description, then try again.');const known=new Set([pCol,nCol,brandCol,unitCol,kindCol,rateCol,taxCol].filter(x=>x>=0));let added=0,updated=0,skipped=0;for(const row of rows.slice(headerRow+1)){const partNumber=String(row[pCol]??'').trim();const name=String(row[nCol]??'').trim()||partNumber;if(!name){skipped++;continue}const rawKind=String(row[kindCol]??'').trim().toLowerCase();const kind=/service|labou?r|repair|inspection|maintenance/.test(rawKind)?'Service':'Part';const brand=String(row[brandCol]??'').trim();const unit=String(row[unitCol]??'').trim();const rate=parseAmount(row[rateCol],0);const taxRate=parseAmount(row[taxCol],num(db.settings.taxRate));const details=headers.map((h,i)=>[h,String(row[i]??'').trim()]).filter(([h,v],i)=>v&&!known.has(i));const existing=partNumber?db.catalog.find(c=>String(c.partNumber||'').trim().toLowerCase()===partNumber.toLowerCase()):null;if(existing){existing.name=name;existing.brand=brand||existing.brand||'';existing.unit=unit||existing.unit||'';existing.kind=kind;existing.rate=rate;existing.taxRate=taxRate;existing.details=details.length?details:existing.details||[];updated++}else{db.catalog.push({id:uid(),partNumber,name,brand,unit,kind,rate,taxRate,details});added++}}if(!added&&!updated)throw new Error('No usable item rows found. Check that each row has a part number or description.');save();catalogSearch='';render();toast(`Import complete: ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}.`)}      function confirmModal(title,body,action,label='Delete'){openModal(`<div class="modal-head"><div><h2>${title}</h2></div><button class="close" data-close>×</button></div><div class="modal-body"><p style="margin:0;color:var(--muted);font-size:12px">${body}</p></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" data-confirm="${action}">${label}</button></div>`,true)}
      document.addEventListener('click',e=>{const pageBtn=e.target.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;searchText='';render();return}const pageLink=e.target.closest('[data-page-link]');if(pageLink){e.preventDefault();page=pageLink.dataset.pageLink;searchText='';render();return}const newBtn=e.target.closest('[data-action="new-invoice"]');if(newBtn){e.preventDefault();showBuilder();return}if(e.target.closest('[data-close]')){closeModal();return}const addline=e.target.closest('[data-add-line]');if(addline){document.getElementById('line-items').insertAdjacentHTML('beforeend',lineRow({id:uid(),qty:1,rate:0,taxRate:num(db.settings.taxRate)}));refreshTotals();return}const remove=e.target.closest('.remove');if(remove){remove.closest('.line-row').remove();refreshTotals();return}const open=e.target.closest('[data-open],[data-open-btn]');if(open){showDetail(open.dataset.open||open.dataset.openBtn);return}const edit=e.target.closest('[data-edit]');if(edit){const id=edit.dataset.edit;closeModal();showBuilder(id);return}const print=e.target.closest('[data-action="print"]');if(print){printInvoice(print.dataset.id);return}const share=e.target.closest('[data-share]');if(share){shareInvoice(share.dataset.id,share.dataset.share);return}const paid=e.target.closest('[data-mark-paid]');if(paid){const i=db.invoices.find(x=>x.id===paid.dataset.markPaid);if(i){i.paid=true;i.paidAt=today();save();closeModal();render();toast('Bill marked as paid.')}return}const delInv=e.target.closest('[data-delete-invoice]');if(delInv){confirmModal('Delete this bill?','This removes the bill from this device. This cannot be undone.','invoice:'+delInv.dataset.deleteInvoice);return}const delItem=e.target.closest('[data-delete-item]');if(delItem){confirmModal('Remove this item?','This only removes it from your saved parts and services list. Existing bills are unchanged.','item:'+delItem.dataset.deleteItem);return}const confirm=e.target.closest('[data-confirm]');if(confirm){const action=confirm.dataset.confirm;if(action==='clear'){localStorage.removeItem(KEY);db=structuredClone(defaults);closeModal();render();toast('Local data cleared.');return}const [kind,id]=action.split(':');if(kind==='invoice')db.invoices=db.invoices.filter(x=>x.id!==id);if(kind==='item')db.catalog=db.catalog.filter(x=>x.id!==id);save();closeModal();render();toast(kind==='invoice'?'Bill deleted.':'Item removed.');return}const csv=e.target.closest('[data-action="export-csv"]');if(csv){exportCSV();return}const backup=e.target.closest('[data-action="backup"]');if(backup){download('forgeflow-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded.');return}const restore=e.target.closest('[data-action="restore"]');if(restore){document.getElementById('restore-file').click();return}const clear=e.target.closest('[data-action="clear-data"]');if(clear){confirmModal('Clear all local data?','This permanently removes invoices, saved items and settings from this browser. Download a backup first if you need one.','clear','Clear all data');return}});
      document.addEventListener('input',e=>{if(e.target.id==='invoice-search'){searchText=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('invoice-search');n?.focus();n?.setSelectionRange(pos,pos)}if(e.target.id==='customer-search'){searchText=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('customer-search');n?.focus();n?.setSelectionRange(pos,pos)}if(e.target.matches('.qty,.rate,.tax'))refreshTotals()});
      document.addEventListener('change',e=>{if(e.target.id==='invoice-filter'){invoiceFilter=e.target.value;render();document.getElementById('invoice-filter').value=invoiceFilter}if(e.target.matches('.line-kind'))syncKind(e.target.closest('.line-row'));if(e.target.matches('.product-pick')){const row=e.target.closest('.line-row');const c=findCatalogItem(e.target.value);if(c){row.querySelector('.line-kind').value=c.kind;row.querySelector('.desc-input').value=catalogLabel(c);row.querySelector('.rate').value=c.rate;row.querySelector('.tax').value=c.taxRate;syncKind(row);refreshTotals()}}});
      document.addEventListener('click',e=>{if(e.target.closest('[data-action="import-catalog"]'))document.getElementById('catalog-import-file')?.click()});
      document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){catalogSearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('catalog-search');n?.focus();n?.setSelectionRange(pos,pos)}});
      document.addEventListener('change',async e=>{if(e.target.id==='catalog-import-file'){const file=e.target.files[0];if(!file)return;try{await importCatalogFile(file)}catch(err){toast(err?.message||'Could not read the spreadsheet. Try .xlsx or .csv.')}e.target.value=''}});      document.addEventListener('submit',e=>{if(e.target.id==='invoice-form'){e.preventDefault();const f=e.target;if(!f.reportValidity())return;const data=new FormData(f);const id=f.dataset.id;const old=id?db.invoices.find(x=>x.id===id):null;const items=collectLines();if(!items.length){toast('Add a description to at least one bill line.');return}const inv={...(old||{}),id:old?.id||uid(),number:old?.number||invNumber(),customerName:String(data.get('customerName')||'').trim(),customerPhone:String(data.get('customerPhone')||'').trim(),customerEmail:String(data.get('customerEmail')||'').trim(),customerAddress:String(data.get('customerAddress')||'').trim(),machineRef:String(data.get('machineRef')||'').trim(),date:data.get('date')||today(),dueDate:data.get('dueDate')||'',notes:String(data.get('notes')||'').trim(),items,createdAt:old?.createdAt||new Date().toISOString()};if(old){db.invoices=db.invoices.map(x=>x.id===id?inv:x)}else db.invoices.push(inv);save();closeModal();page='invoices';render();toast(old?'Bill updated.':'Bill saved.');return}if(e.target.id==='item-form'){e.preventDefault();const d=new FormData(e.target);db.catalog.push({id:uid(),partNumber:String(d.get('partNumber')||'').trim(),name:String(d.get('name')).trim(),brand:String(d.get('brand')||'').trim(),unit:String(d.get('unit')||'').trim(),kind:d.get('kind'),rate:num(d.get('rate')),taxRate:num(d.get('taxRate')),details:[]});save();render();toast('Item added to your list.');return}if(e.target.id==='settings-form'){e.preventDefault();const d=new FormData(e.target);db.settings={...db.settings,businessName:String(d.get('businessName')).trim(),tagline:String(d.get('tagline')).trim(),phone:String(d.get('phone')).trim(),email:String(d.get('email')).trim(),address:String(d.get('address')).trim(),taxId:String(d.get('taxId')).trim(),taxName:String(d.get('taxName')).trim()||'Tax',taxRate:num(d.get('taxRate')),currency:String(d.get('currency')).trim().toUpperCase()||'INR'};save();render();toast('Business details saved.')}});
      document.getElementById('restore-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.settings||!Array.isArray(d.invoices)||!Array.isArray(d.catalog))throw new Error('Invalid backup');db={...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings}};save();render();toast('Backup restored.')}catch{toast('Could not read that backup file.')}e.target.value=''});
      render();
    })();
