  <style>

    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 23px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:18px}.modal-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.close{border:0;background:#f1f4f1;border-radius:8px;width:34px;height:34px;color:#526058;font-size:20px}
    .modal-body{padding:20px 23px;overflow-y:auto}.modal-foot{padding:14px 23px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fcfdfc;flex-wrap:wrap}

    .line-header,.line-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 105px 66px 66px 110px 30px;gap:8px;align-items:center}.line-header{font-size:11px;color:#77857c;font-weight:650;padding:0 2px 6px}.line-row{padding:9px 0;border-top:1px solid #eef2ee}.line-row input{padding:8px 9px;font-size:14px;min-width:0}

    .bill-bottom{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;margin-top:16px;align-items:start}

    .helper{font-size:12px;color:var(--muted);margin-top:5px}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}
    .detail-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.detail-total{font-size:28px;font-weight:800;letter-spacing:-.03em}.detail-table{margin:17px 0}.detail-table th,.detail-table td{padding:9px 11px}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;background:#172f25;color:white;padding:12px 18px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
    .setting-card{max-width:780px;margin-bottom:15px}.setting-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .customer-avatar{width:32px;height:32px;background:#e9f4ed;color:var(--green);display:grid;place-items:center;border-radius:10px;font-weight:700;margin-right:10px;font-size:12px}.customer-name-wrap{display:flex;align-items:center}
    .hint-box{background:#f2f7f2;border-radius:8px;padding:10px 12px;color:#56665d;font-size:12px;margin-top:12px}.hidden{display:none!important}
    .pl-info{display:flex;gap:12px;align-items:center}.pl-badge{width:42px;height:42px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:20px;color:var(--green);flex:none}
    kbd{font:11px ui-monospace,monospace;background:#fff;border:1px solid #d5e0d8;border-bottom-width:2px;border-radius:4px;padding:1px 5px}
    @media(max-width:1000px){.sidebar{width:218px}.main{margin-left:218px}.metrics{grid-template-columns:repeat(2,1fr)}.grid-two{grid-template-columns:1fr}.bill-bottom{grid-template-columns:1fr}}

      .sidebar{width:64px;padding:20px 8px}.brand{padding:0 5px 26px}.brand-name,.brand-sub,.nav-label,.nav-text,.sidebar-foot{display:none}.nav button{justify-content:center;padding:12px 5px}.main{margin-left:64px}
      .topbar{height:62px;padding:0 16px}.content{padding:22px 16px 45px}.page-head{display:block}.page-head .btn{margin-top:12px}.page-head h1{font-size:22px}.top-actions .avatar{display:none}
      .form-grid.three{grid-template-columns:1fr 1fr}.result-row{grid-template-columns:1fr auto;gap:4px 10px}.result-row .desc{grid-column:1/-1;grid-row:2}.result-row .gst{display:none}
      .sg{grid-template-columns:1fr auto}.sg .desc{grid-column:1/-1;grid-row:2;font-size:12px}
      .line-header{display:none}.line-row{grid-template-columns:repeat(4,minmax(0,1fr)) 30px;grid-template-areas:"d d d d x" "q r s g g" "a a a a a"}.line-desc{grid-area:d}.c-q{grid-area:q}.c-r{grid-area:r}.c-s{grid-area:s}.c-g{grid-area:g}.cell span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}.line-amount{grid-area:a}.line-row .remove{grid-area:x}
      .modal-layer{padding:0}.modal{max-height:100vh;border-radius:0;height:100%}.modal-head,.modal-body{padding-left:16px;padding-right:16px}.modal-foot{padding:12px 16px}.search{max-width:none;min-width:100%}
    }

      @page{size:A4;margin:10mm}
      body{background:white}.sidebar,.main,#modal-root,.toast{display:none!important}#print-area{display:block!important;color:#1a2620;font:11px/1.45 Arial,sans-serif}

      .print-sign{margin-top:50px;text-align:right}.print-footer{border-top:1px solid #e0e6e1;margin-top:28px;padding-top:10px;color:#6b776f;text-align:center;font-size:9px}

<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">F</div><div><div class="brand-name">ForgeFlow</div><div class="brand-sub">Workshop billing</div></div></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="main-nav">
      <button class="active" data-page="overview" title="Home"><span class="nav-icon">◫</span><span class="nav-text">Home</span></button>
      <button data-page="invoices" title="Bills"><span class="nav-icon">▤</span><span class="nav-text">Bills</span></button>
      <button data-page="items" title="Price list"><span class="nav-icon">⚙</span><span class="nav-text">Price list &amp; parts</span></button>
      <button data-page="customers" title="Customers"><span class="nav-icon">♙</span><span class="nav-text">Customers</span></button>
      <button data-page="settings" title="Settings"><span class="nav-icon">⌘</span><span class="nav-text">Business settings</span></button>
    </nav>
    <div class="sidebar-foot"><div id="pl-status"><span class="local-dot wait"></span>Loading price list…</div><div style="margin-top:6px"><span class="local-dot"></span>Bills are saved on this device.</div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><div class="eyebrow" id="top-eyebrow">HOME</div><div class="top-title" id="top-business">Your workshop</div></div><div class="top-actions"><button class="btn primary" data-action="new-invoice">＋ New bill</button><div class="avatar" id="avatar">YW</div></div></header>
    <div class="content" id="view-root"></div>
  </main>
  <div id="modal-root"></div>
  <section id="print-area" style="display:none"></section>
  <input id="restore-file" type="file" accept="application/json" hidden>
  <input id="pricelist-file" type="file" accept=".xlsx,.csv" hidden>
  <script>
  (()=>{
    const KEY='forgeflow_billing_v1';
    const BUILT_IN_LIST={url:'data/mrp-june-2025.json',name:"MRP June'25"};
    const defaults={settings:{businessName:'Your workshop',tagline:'Machine parts & service',phone:'',email:'',address:'',taxId:'',taxName:'GST',taxRate:18,currency:'INR',mrpInclusive:true,roundOff:true,terms:''},catalog:[
      {id:'c3',kind:'Service',partNumber:'',name:'Workshop labour',brand:'',unit:'hour',details:[],rate:0,taxRate:18},
      {id:'c4',kind:'Service',partNumber:'',name:'Machine inspection',brand:'',unit:'',details:[],rate:0,taxRate:18}
    ],invoices:[]};
    let db=load();let page='overview';let searchText='';let catalogSearch='';let lookupText='';let invoiceFilter='all';let toastTimer;
    // The MRP price list is large, so it lives in memory (and IndexedDB when uploaded), never in localStorage.
    let priceList={name:'',rows:[],status:'loading',custom:false};

    function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.settings?{...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings},catalog:d.catalog||[],invoices:d.invoices||[]}:structuredClone(defaults)}catch{return structuredClone(defaults)}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Could not save — this browser’s storage is full. Download a backup.')}updateBrand()}
    function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function money(n){const code=db.settings.currency||'INR';try{return new Intl.NumberFormat(code==='INR'?'en-IN':undefined,{style:'currency',currency:code,maximumFractionDigits:2}).format(Number(n)||0)}catch{return code+' '+(Number(n)||0).toFixed(2)}}
    function dateFmt(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return Number.isNaN(+d)?s:d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
    function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
    function num(v){return Math.max(0,Number(v)||0)}

    // ---- Money maths. MRP in India already includes GST, so "inclusive" bills back the tax out of the price.
    function lineCalc(x,inclusive){const gross=num(x.qty)*num(x.rate)*(1-Math.min(100,num(x.disc))/100);const g=num(x.taxRate);const taxable=inclusive?gross/(1+g/100):gross;const tax=inclusive?gross-taxable:gross*g/100;return{taxable,tax,amount:taxable+tax}}
    function totals(inv){let subtotal=0,tax=0;(inv.items||[]).forEach(x=>{const c=lineCalc(x,inv.inclusive);subtotal+=c.taxable;tax+=c.tax});const exact=subtotal+tax;const total=inv.roundOff?Math.round(exact):exact;return{subtotal,tax,roundOff:total-exact,total}}
    function taxLines(inv,t){const name=db.settings.taxName||'Tax';if(inv.gstType==='inter')return [['IGST',t.tax]];if(inv.gstType==='intra')return [['CGST',t.tax/2],['SGST',t.tax/2]];return [[name,t.tax]]}
    function words(n){n=Math.round(n);if(!n)return 'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');const parts=[];[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']].forEach(([v,w])=>{if(n>=v){parts.push((v===1e7?words(Math.floor(n/v)):two(Math.floor(n/v)))+' '+w);n%=v}});if(n)parts.push(three(n));return parts.join(' ')}

    function invNumber(){const y=new Date().getFullYear();const prefix='INV-'+y+'-';const max=db.invoices.reduce((m,x)=>String(x.number||'').startsWith(prefix)?Math.max(m,parseInt(String(x.number).slice(prefix.length))||0):m,0);return prefix+String(max+1).padStart(3,'0')}
    function state(inv){if(inv.paid)return 'Paid';return inv.dueDate&&inv.dueDate<today()?'Overdue':'Open'}
    function badge(s){return `<span class="status ${s.toLowerCase()}">${s}</span>`}
    function updateBrand(){const s=db.settings;document.title=(s.businessName||'Your workshop')+' — ForgeFlow';document.getElementById('top-business').textContent=s.businessName||'Your workshop';document.getElementById('avatar').textContent=(s.businessName||'YW').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3000)}

    // ---- Price list loading & search
    function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('forgeflow',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const q=fn(d.transaction('kv',mode).objectStore('kv'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
    function setPriceList(name,rows,custom){priceList={name,custom,status:'ready',rows:rows.map(r=>{const pn=String(r[0]??'').trim(),desc=String(r[1]??'').trim();return{pn,desc,mrp:num(r[2]),gst:r[3]===null||r[3]===undefined||r[3]===''?null:num(r[3]),hay:(pn+' '+desc).toLowerCase(),pnn:normPn(pn)}})}}
    async function loadPriceList(){
      try{const saved=await idbDo('readonly',s=>s.get('pricelist'));if(saved?.rows?.length){setPriceList(saved.name,saved.rows,true);return afterPriceList()}}catch{}
      try{const res=await fetch(BUILT_IN_LIST.url);if(!res.ok)throw 0;const d=await res.json();setPriceList(d.name||BUILT_IN_LIST.name,d.rows,false)}catch{priceList.status='error'}
      afterPriceList()}
    function afterPriceList(){const el=document.getElementById('pl-status');el.innerHTML=priceList.status==='ready'?`<span class="local-dot"></span>${esc(priceList.name)} · ${priceList.rows.length.toLocaleString('en-IN')} parts`:'<span class="local-dot wait"></span>Price list not loaded';if(page==='items')render();refreshLookup()}
    function normPn(s){return String(s).toLowerCase().replace(/[\s\/\-.]/g,'')}
    function mine(){return db.catalog.map(c=>({src:'mine',id:c.id,pn:c.partNumber||'',desc:c.name,mrp:num(c.rate),gst:num(c.taxRate),kind:c.kind||'Part',unit:c.unit||'',hay:((c.partNumber||'')+' '+c.name+' '+(c.brand||'')).toLowerCase(),pnn:normPn(c.partNumber||'')}))}
    // Ranks: exact part number, part number starts with, description starts with, anything containing every word.
    function searchParts(q,limit=8){q=q.trim().toLowerCase();if(!q)return{items:[],total:0};const words=q.split(/\s+/).map(w=>[w,normPn(w)]),qn=normPn(q);const buckets=[[],[],[],[]];const test=r=>{for(const [w,wn] of words){if(!r.hay.includes(w)&&!(wn&&r.pnn.includes(wn)))return -1}if(qn&&r.pnn===qn)return 0;if(qn&&r.pnn.startsWith(qn))return 1;if(r.hay.startsWith(q,r.pn.length+1))return 2;return 3};for(const list of [mine(),priceList.rows]){for(const r of list){const s=test(r);if(s>=0)buckets[s].push(r)}}const all=buckets.flat();return{items:all.slice(0,limit),total:all.length}}
    function gstOf(r){return r.gst===null?num(db.settings.taxRate):r.gst}

    function pageTitle(){return {overview:['Home','Check a price or start a bill'],invoices:['Bills','Create, find and follow up on customer bills'],customers:['Customers','Your customer list, built from your bills'],items:['Price list & parts','Search the MRP list and keep your own labour and parts'],settings:['Business settings','Details that appear on every bill']}[page]}
    function render(){updateBrand();document.querySelectorAll('#main-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const [title,sub]=pageTitle();document.getElementById('top-eyebrow').textContent=title.toUpperCase();document.getElementById('view-root').innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${page==='overview'?'<button class="btn primary big" data-action="new-invoice">＋ Create a bill</button>':''}</div>${page==='overview'?overview():page==='invoices'?invoicesView():page==='customers'?customersView():page==='items'?itemsView():settingsView()}`;if(page==='overview')refreshLookup();if(page==='items')refreshCatalog()}

    function resultRow(r){return `<div class="result-row"><span class="pn">${esc(r.pn||'—')}</span><span class="desc">${esc(r.desc)} ${r.src==='mine'?'<span class="tag saved">MY ITEM</span>':''}</span><span class="gst muted" style="font-size:12px">GST ${gstOf(r)}%</span><span class="mrp">${money(r.mrp)}</span><button class="btn small soft" data-bill-part='${esc(JSON.stringify(partToLine(r)))}'>＋ Bill</button></div>`}
    function refreshLookup(){const box=document.getElementById('lookup-results');if(!box)return;if(!lookupText.trim()){box.innerHTML='';return}if(priceList.status==='loading'){box.innerHTML='<div class="result-more">Price list is still loading…</div>';return}const {items,total}=searchParts(lookupText,8);box.innerHTML=items.length?items.map(resultRow).join('')+(total>items.length?`<div class="result-more">Showing 8 of ${total.toLocaleString('en-IN')} matches — type more of the part number or name to narrow down.</div>`:''):'<div class="result-more">No part found. Check the part number, or add it as your own item under Price list &amp; parts.</div>'}

    function overview(){const list=[...db.invoices].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const month=today().slice(0,7);const unpaid=db.invoices.filter(x=>!x.paid);const paid=db.invoices.filter(x=>x.paid&&(x.paidAt||x.date||'').slice(0,7)===month).reduce((a,x)=>a+totals(x).total,0);const outstanding=unpaid.reduce((a,x)=>a+totals(x).total,0);const customers=new Set(db.invoices.map(x=>(x.customerName||'').trim().toLowerCase()).filter(Boolean)).size;
      return `<section class="card lookup"><div class="card-title">Check a part price</div><div class="card-note">Type a part number or name — e.g. <b>335/G1419</b> or <b>seal kit</b></div><div class="big-search"><input id="lookup" placeholder="Part number or description…" value="${esc(lookupText)}" autocomplete="off"></div><div class="lookup-results" id="lookup-results"></div></section>
        <div class="metrics"><div class="metric"><div class="metric-label">To be collected</div><div class="metric-value">${money(outstanding)}</div><div class="metric-note">${unpaid.length} unpaid bill${unpaid.length===1?'':'s'}</div></div><div class="metric"><div class="metric-label">Collected this month</div><div class="metric-value">${money(paid)}</div><div class="metric-note">Bills marked paid this month</div></div><div class="metric"><div class="metric-label">Bills made</div><div class="metric-value">${db.invoices.length}</div><div class="metric-note">On this device</div></div><div class="metric"><div class="metric-label">Customers</div><div class="metric-value">${customers}</div><div class="metric-note">From your bills</div></div></div>
        <div class="grid-two"><section class="card list-card" style="margin-top:0"><div class="card-head"><div><div class="card-title">Recent bills</div><div class="card-note">Click a bill to view, print or mark paid</div></div><button class="btn small" data-page-link="invoices">All bills →</button></div>${list.length?invoiceTable(list.slice(0,6),false):emptyBlock('No bills yet','Click “Create a bill”, type part numbers, and the MRP and GST fill in automatically.','Create your first bill')}</section>
        <section class="card"><div class="card-head"><div><div class="card-title">Billing — last 6 months</div></div></div>${chart()}<div class="chart-legend"><span><i class="legend-dot"></i>Unpaid</span><span><i class="legend-dot paid"></i>Paid</span></div><hr class="divider"><div class="quick-actions"><a class="quick-action" href="#" data-page-link="items"><span class="quick-icon">⚙</span><span><b>Price list &amp; labour charges</b><small>Upload a new MRP list, add labour rates</small></span></a><a class="quick-action" href="#" data-page-link="settings"><span class="quick-icon">⌘</span><span><b>Business details</b><small>Name, GSTIN and address for your bills</small></span></a></div></section></div>`}
    function chart(){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('en-IN',{month:'short'})})}const vals=months.map(m=>{const xs=db.invoices.filter(i=>i.date?.slice(0,7)===m.key);return{label:m.label,open:xs.filter(x=>!x.paid).reduce((a,x)=>a+totals(x).total,0),paid:xs.filter(x=>x.paid).reduce((a,x)=>a+totals(x).total,0)}});const max=Math.max(1,...vals.map(x=>x.open+x.paid));return `<div class="chart">${vals.map(v=>`<div class="chart-col"><div class="bar-wrap" title="${esc(v.label)} · ${money(v.open+v.paid)}"><div class="bar" style="height:${Math.max(2,v.open/max*100)}%"></div><div class="bar paid" style="height:${Math.max(2,v.paid/max*100)}%"></div></div><span class="chart-label">${esc(v.label)}</span></div>`).join('')}</div>`}
    function invoiceTable(list,showActions=true){return `<div class="table-wrap"><table><thead><tr><th>BILL NO.</th><th>CUSTOMER</th><th>DATE</th><th>STATUS</th><th class="right">AMOUNT</th>${showActions?'<th></th>':''}</tr></thead><tbody>${list.map(i=>`<tr data-open="${esc(i.id)}"><td><span class="invoice-no">${esc(i.number)}</span></td><td><b>${esc(i.customerName||'Unnamed customer')}</b><div class="subcell">${esc(i.machineRef||'')}</div></td><td>${dateFmt(i.date)}</td><td>${badge(state(i))}</td><td class="num"><b>${money(totals(i).total)}</b></td>${showActions?'<td class="right"><button class="btn small" data-open-btn="'+esc(i.id)+'">View</button></td>':''}</tr>`).join('')}</tbody></table></div>`}
    function emptyBlock(title,text,button){return `<div class="empty"><div class="empty-icon">▤</div><h3>${title}</h3><p>${text}</p><button class="btn primary" data-action="new-invoice">＋ ${button}</button></div>`}
    function invoicesView(){let list=[...db.invoices].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.number||'').localeCompare(a.number||''));if(searchText){const q=searchText.toLowerCase();list=list.filter(i=>[i.number,i.customerName,i.customerPhone,i.machineRef,...(i.items||[]).map(x=>x.partNumber)].some(x=>(x||'').toLowerCase().includes(q)))}if(invoiceFilter!=='all')list=list.filter(i=>state(i).toLowerCase()===invoiceFilter);return `<div class="toolbar"><div class="search"><input id="invoice-search" class="field" placeholder="Search bill no., customer, phone, machine or part…" value="${esc(searchText)}"></div><select id="invoice-filter" class="field" style="width:auto;min-width:140px"><option value="all">All bills</option><option value="open">Unpaid</option><option value="overdue">Overdue</option><option value="paid">Paid</option></select><span style="flex:1"></span><button class="btn" data-action="export-csv">↓ Export to Excel (CSV)</button><button class="btn primary" data-action="new-invoice">＋ New bill</button></div><section class="card list-card" style="margin-top:0">${list.length?invoiceTable(list,true):db.invoices.length?`<div class="empty"><div class="empty-icon">⌕</div><h3>No matching bills</h3><p>Try another search or filter.</p></div>`:emptyBlock('Your bills will show here','Create a bill for parts, labour or both, then print it or send it on WhatsApp.','Create a bill')}</section>`}
    function customerRows(){const map=new Map();db.invoices.forEach(i=>{const key=(i.customerName||'Unnamed customer').trim().toLowerCase();let c=map.get(key);if(!c){c={name:i.customerName||'Unnamed customer',phone:'',email:'',address:'',gstin:'',count:0,billed:0,open:0,last:''};map.set(key,c)}c.count++;c.billed+=totals(i).total;if(!i.paid)c.open+=totals(i).total;if((i.date||'')>=c.last){c.last=i.date||'';c.phone=i.customerPhone||c.phone;c.email=i.customerEmail||c.email;c.address=i.customerAddress||c.address;c.gstin=i.customerGstin||c.gstin}});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
    function customersView(){const cs=customerRows().filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(searchText.toLowerCase()));return `<div class="toolbar"><div class="search"><input id="customer-search" class="field" placeholder="Search customers…" value="${esc(searchText)}"></div><span class="muted" style="font-size:12px">${cs.length} customer${cs.length===1?'':'s'}</span></div><section class="card list-card" style="margin-top:0">${db.invoices.length?`<div class="table-wrap"><table><thead><tr><th>CUSTOMER</th><th>CONTACT</th><th>BILLS</th><th>LAST BILL</th><th class="right">TOTAL BILLED</th><th class="right">UNPAID</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td><div class="customer-name-wrap"><span class="customer-avatar">${esc(c.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><b>${esc(c.name)}</b></div></td><td>${esc(c.phone||c.email||'—')}</td><td>${c.count}</td><td>${dateFmt(c.last)}</td><td class="num">${money(c.billed)}</td><td class="num"><b>${money(c.open)}</b></td><td class="right"><button class="btn small soft" data-bill-customer="${esc(c.name)}">＋ New bill</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">♙</div><h3>Customers appear after your first bill</h3><p>Next time you type their name on a bill, phone and address fill in automatically.</p><button class="btn primary" data-action="new-invoice">＋ Create a bill</button></div>`}</section>`}

    function itemsView(){const pl=priceList;const plCard=`<section class="card"><div class="pl-info"><span class="pl-badge">₹</span><div><div class="card-title">${pl.status==='ready'?esc(pl.name):pl.status==='loading'?'Loading price list…':'Price list not loaded'}</div><div class="card-note">${pl.status==='ready'?pl.rows.length.toLocaleString('en-IN')+' parts · '+(pl.custom?'uploaded on this device':'built in'):'Upload your MRP Excel file to search parts.'}</div></div></div><div class="setting-actions"><button class="btn primary" data-action="upload-pricelist">↑ Upload new MRP list</button>${pl.custom?'<button class="btn" data-action="reset-pricelist">Use built-in list</button>':''}</div><div class="hint-box">When the company sends a new MRP Excel file, upload it here. It needs columns like <b>Material</b> (part no.), <b>Desc</b>, <b>MRP</b> and <b>GST rate</b>. The file stays on this device. Old bills keep their prices.</div></section>`;
      const mineList=db.catalog.length?`<div class="table-wrap" style="margin-top:12px"><table><tbody>${db.catalog.map(c=>`<tr><td class="wrap"><b>${esc(c.name)}</b><div class="subcell">${esc([c.partNumber,c.kind,c.unit].filter(Boolean).join(' · '))}</div></td><td class="num">${money(c.rate)}</td><td class="right"><button class="btn small danger" data-delete-item="${esc(c.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'';
      const form=`<section class="card" style="margin-top:16px"><div class="card-title">Your labour charges &amp; extra parts</div><div class="card-note">For things not in the MRP list — labour, inspection, local parts. They show up first when you search.</div>${mineList}<form id="item-form" style="margin-top:16px"><div class="form-grid"><div class="wide"><label>Name *</label><input name="name" class="field" required placeholder="e.g. Engine overhaul labour"></div><div><label>Type</label><select name="kind" class="field"><option>Service</option><option>Part</option></select></div><div><label>Part no. (optional)</label><input name="partNumber" class="field" placeholder="—"></div><div><label>Price (${esc(db.settings.currency)})</label><input name="rate" class="field" type="number" min="0" step="0.01" value="0"></div><div><label>${esc(db.settings.taxName)} %</label><input name="taxRate" class="field" type="number" min="0" step="0.01" value="${num(db.settings.taxRate)}"></div></div><button class="btn primary" style="margin-top:14px">＋ Save item</button></form></section>`;
      return `<div class="grid-two"><div><div class="toolbar"><div class="search" style="max-width:none"><input id="catalog-search" class="field" style="font-size:15px;padding-top:12px;padding-bottom:12px" placeholder="Search part number or description…" value="${esc(catalogSearch)}" autocomplete="off"></div></div><section class="card list-card" style="margin-top:0" id="catalog-results"></section></div><div>${plCard}${form}</div></div>`}
    function refreshCatalog(){const box=document.getElementById('catalog-results');if(!box)return;const q=catalogSearch.trim();if(!q){box.innerHTML=`<div class="empty"><div class="empty-icon">⌕</div><h3>Search ${priceList.rows.length?priceList.rows.length.toLocaleString('en-IN')+' parts':'the price list'}</h3><p>Type a part number like <b>1096231630</b> or words like <b>oil seal</b>. Click “＋ Bill” to start a bill with that part.</p></div>`;return}const {items,total}=searchParts(q,100);box.innerHTML=items.length?`<div class="table-wrap"><table><thead><tr><th>PART NO.</th><th>DESCRIPTION</th><th class="right">MRP</th><th class="right">GST</th><th></th></tr></thead><tbody>${items.map(r=>`<tr><td><b>${esc(r.pn||'—')}</b></td><td class="wrap">${esc(r.desc)} ${r.src==='mine'?'<span class="tag saved">MY ITEM</span>':''}</td><td class="num"><b>${money(r.mrp)}</b></td><td class="num">${gstOf(r)}%</td><td class="right"><button class="btn small soft" data-bill-part='${esc(JSON.stringify(partToLine(r)))}'>＋ Bill</button></td></tr>`).join('')}</tbody></table></div><div class="result-more">${total>items.length?`Showing first 100 of ${total.toLocaleString('en-IN')} matches. Type more to narrow down.`:`${total} match${total===1?'':'es'}`}</div>`:'<div class="empty"><div class="empty-icon">⌕</div><h3>No matching parts</h3><p>Check the part number, or save it on the right as your own item.</p></div>'}

    function settingsView(){const s=db.settings;return `<section class="card setting-card"><div class="card-title">Business details</div><div class="card-note">Printed at the top of every bill.</div><form id="settings-form"><div class="form-grid" style="margin-top:16px"><div><label>Business name</label><input class="field" name="businessName" value="${esc(s.businessName)}" required></div><div><label>Short description</label><input class="field" name="tagline" value="${esc(s.tagline)}" placeholder="Machine parts & service"></div><div><label>Phone</label><input class="field" name="phone" value="${esc(s.phone)}"></div><div><label>Email</label><input class="field" name="email" type="email" value="${esc(s.email)}"></div><div class="wide"><label>Business address</label><textarea class="field" name="address" rows="2">${esc(s.address)}</textarea></div><div><label>Your GSTIN</label><input class="field" name="taxId" value="${esc(s.taxId)}" placeholder="e.g. 09ABCDE1234F1Z5"></div><div><label>Default GST rate for new items (%)</label><input class="field" name="taxRate" type="number" min="0" step="0.01" value="${num(s.taxRate)}"></div><div class="wide"><label>Bank / UPI details and terms (printed on every bill)</label><textarea class="field" name="terms" rows="2" placeholder="e.g. UPI: workshop@okbank · Goods once sold will not be taken back">${esc(s.terms)}</textarea></div><div class="wide"><label class="check"><input type="checkbox" name="mrpInclusive" ${s.mrpInclusive?'checked':''}><span><b>MRP already includes GST</b> (normal in India). The bill total equals MRP × qty and GST is shown inside it. Untick if your prices are before GST.</span></label></div><div class="wide"><label class="check"><input type="checkbox" name="roundOff" ${s.roundOff?'checked':''}><span><b>Round bill total</b> to the nearest rupee</span></label></div></div><button class="btn primary" style="margin-top:15px">Save business details</button></form></section><section class="card setting-card"><div class="card-title">Your data</div><div class="card-note">Bills and settings stay in this browser on this device. Download a backup regularly, and before changing computer or clearing browser data.</div><div class="setting-actions"><button class="btn" data-action="backup">↓ Download backup</button><button class="btn" data-action="restore">↑ Restore backup</button><button class="btn danger" data-action="clear-data">Clear all bills &amp; settings</button></div></section>`}

    function openModal(html,cls=''){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-layer"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;root.querySelector('.modal-layer').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal()})}
    function closeModal(){document.getElementById('modal-root').innerHTML=''}

    // ---- Bill builder
    function partToLine(r){return{kind:r.kind||'Part',partNumber:r.pn,description:r.desc,qty:1,rate:r.mrp,disc:0,taxRate:gstOf(r)}}

      const text=async name=>{const b=await entry(name);return b?decoder.decode(b):null};let shared=[];const sharedText=await text('xl/sharedStrings.xml');if(sharedText){const doc=parseXml(sharedText);shared=[...doc.getElementsByTagNameNS('*','si')].map(si=>[...si.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join(''))}let sheetPath='xl/worksheets/sheet1.xml';const workbookText=await text('xl/workbook.xml');if(workbookText){const book=parseXml(workbookText);const first=book.getElementsByTagNameNS('*','sheet')[0];if(first){const relId=first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||first.getAttribute('r:id');const relText=await text('xl/_rels/workbook.xml.rels');if(relText&&relId){const relDoc=parseXml(relText);const rel=[...relDoc.getElementsByTagNameNS('*','Relationship')].find(x=>x.getAttribute('Id')===relId);if(rel){const target=rel.getAttribute('Target');sheetPath=target.startsWith('/')?target.slice(1):('xl/'+target).replace(/\/\.\//g,'/');const parts=[];sheetPath.split('/').forEach(x=>{if(x==='..')parts.pop();else if(x!=='.')parts.push(x)});sheetPath=parts.join('/')}}}}const sheetText=await text(sheetPath);if(!sheetText)throw new Error('No worksheet was found in that Excel file.');const doc=parseXml(sheetText);const rows=[];for(const rowEl of doc.getElementsByTagNameNS('*','row')){const row=[];for(const cell of rowEl.getElementsByTagNameNS('*','c')){const ref=cell.getAttribute('r')||'A1';const letters=(ref.match(/[A-Z]+/i)||['A'])[0].toUpperCase();let col=0;for(const ch of letters)col=col*26+ch.charCodeAt(0)-64;col--;const type=cell.getAttribute('t');let val='';if(type==='inlineStr'){val=[...cell.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join('')}else{const v=cell.getElementsByTagNameNS('*','v')[0];val=v?.textContent||'';if(type==='s')val=shared[Number(val)]??'';else if(type==='b')val=val==='1'?'TRUE':'FALSE'}row[col]=val}rows.push(row.map(x=>x??''))}return rows}
    function headerKey(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
    async function importPriceList(file){const ext=file.name.split('.').pop().toLowerCase();toast('Reading '+file.name+'… this can take a few seconds.');let rows;if(ext==='csv')rows=parseDelimited(await file.text());else if(ext==='xlsx')rows=await readXlsx(file);else throw new Error('Please choose an .xlsx Excel file or a .csv file.');const headerRow=rows.findIndex(r=>r.some(v=>String(v||'').trim()));if(headerRow<0)throw new Error('This spreadsheet is empty.');const headers=rows[headerRow].map(headerKey);const find=aliases=>headers.findIndex(h=>aliases.includes(h));const pCol=find(['material','materialcode','materialno','partnumber','partno','part','sku','itemcode','code','productcode']);const dCol=find(['desc','description','materialdescription','partdescription','itemdescription','name','itemname','partname']);const mCol=find(['mrp','mrprs','price','listprice','unitprice','sellingprice','rate']);const gCol=find(['gstrate','gst','gstpercent','gstper','taxrate','tax','taxpercent']);if(pCol<0||mCol<0)throw new Error('Could not find the part number and MRP columns. The first row should have headings like Material, Desc, MRP and GST rate.');const out=[];for(const r of rows.slice(headerRow+1)){const pn=String(r[pCol]??'').replace(/ /g,' ').trim();if(!pn)continue;const mrp=Number(String(r[mCol]??'').replace(/[^0-9.]/g,''));const g=String(r[gCol]??'').replace(/[^0-9.]/g,'');out.push([pn,String(r[dCol]??'').replace(/\s+/g,' ').trim(),Number.isFinite(mrp)?mrp:0,gCol<0||g===''?null:Number(g)])}if(!out.length)throw new Error('No parts found in that file.');const name=file.name.replace(/\.[^.]+$/,'');try{await idbDo('readwrite',s=>s.put({name,rows:out,importedAt:new Date().toISOString()},'pricelist'))}catch{toast('Loaded for now, but this browser would not save it — you may need to upload again next time.')}setPriceList(name,out,true);afterPriceList();render();toast(`Price list updated: ${out.length.toLocaleString('en-IN')} parts from ${name}.`)}
    function confirmModal(title,body,action,label='Delete'){openModal(`<div class="modal-head"><div><h2>${title}</h2></div><button class="close" data-close>×</button></div><div class="modal-body"><p style="margin:0;color:var(--muted);font-size:14px">${body}</p></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" data-confirm="${action}">${label}</button></div>`,'narrow')}

    // ---- Events
    document.addEventListener('click',e=>{
      const t=e.target;const pageBtn=t.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;searchText='';render();return}
      const pageLink=t.closest('[data-page-link]');if(pageLink){e.preventDefault();page=pageLink.dataset.pageLink;searchText='';render();return}
      if(t.closest('[data-action="new-invoice"]')){e.preventDefault();showBuilder();return}
      const bp=t.closest('[data-bill-part]');if(bp){showBuilder(null,{items:[{...JSON.parse(bp.dataset.billPart),id:uid()}]});return}
      const bc=t.closest('[data-bill-customer]');if(bc){showBuilder(null,{customer:customerRows().find(c=>c.name===bc.dataset.billCustomer)});return}
      if(t.closest('[data-close]')){closeModal();return}
      const sg=t.closest('[data-sg]');if(sg){chooseSuggest(+sg.dataset.sg);document.getElementById('add-part').focus();return}
      if(t.closest('[data-add-labour]')){addLine({kind:'Service',description:'',qty:1,rate:0,disc:0,taxRate:num(db.settings.taxRate)},'.desc-input');return}
      const remove=t.closest('.remove');if(remove){remove.closest('.line-row').remove();refreshTotals();return}
      const open=t.closest('[data-open],[data-open-btn]');if(open){showDetail(open.dataset.open||open.dataset.openBtn);return}
      const edit=t.closest('[data-edit]');if(edit){closeModal();showBuilder(edit.dataset.edit);return}
      const print=t.closest('[data-action="print"]');if(print){printInvoice(print.dataset.id);return}
      const share=t.closest('[data-share]');if(share){shareInvoice(share.dataset.id,share.dataset.share);return}
      const paid=t.closest('[data-mark-paid]');if(paid){const i=db.invoices.find(x=>x.id===paid.dataset.markPaid);if(i){i.paid=true;i.paidAt=today();save();closeModal();render();toast('Bill marked as paid.')}return}
      const unpaid=t.closest('[data-mark-unpaid]');if(unpaid){const i=db.invoices.find(x=>x.id===unpaid.dataset.markUnpaid);if(i){i.paid=false;delete i.paidAt;save();showDetail(i.id);render();toast('Bill marked as unpaid.')}return}
      const delInv=t.closest('[data-delete-invoice]');if(delInv){confirmModal('Delete this bill?','This removes the bill from this device. This cannot be undone.','invoice:'+delInv.dataset.deleteInvoice);return}
      const delItem=t.closest('[data-delete-item]');if(delItem){confirmModal('Remove this item?','It is only removed from your saved list. Existing bills are unchanged.','item:'+delItem.dataset.deleteItem,'Remove');return}
      const confirm=t.closest('[data-confirm]');if(confirm){const action=confirm.dataset.confirm;if(action==='clear'){localStorage.removeItem(KEY);db=structuredClone(defaults);closeModal();render();toast('Bills and settings cleared.');return}const [kind,id]=action.split(':');if(kind==='invoice')db.invoices=db.invoices.filter(x=>x.id!==id);if(kind==='item')db.catalog=db.catalog.filter(x=>x.id!==id);save();closeModal();render();toast(kind==='invoice'?'Bill deleted.':'Item removed.');return}
      if(t.closest('[data-action="export-csv"]')){exportCSV();return}
      if(t.closest('[data-action="backup"]')){download('forgeflow-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded.');return}
      if(t.closest('[data-action="restore"]')){document.getElementById('restore-file').click();return}
      if(t.closest('[data-action="clear-data"]')){confirmModal('Clear all bills and settings?','This permanently removes your bills, saved items and settings from this browser. Download a backup first if you need one.','clear','Clear everything');return}
      if(t.closest('[data-action="upload-pricelist"]')){document.getElementById('pricelist-file').click();return}
      if(t.closest('[data-action="reset-pricelist"]')){idbDo('readwrite',s=>s.delete('pricelist')).catch(()=>{}).finally(()=>{priceList.status='loading';render();loadPriceList()});return}
      if(!t.closest('.pick-wrap')){const b=document.getElementById('add-suggest');if(b)b.innerHTML=''}
    });
    document.addEventListener('input',e=>{const t=e.target;
      if(t.id==='lookup'){lookupText=t.value;refreshLookup();return}
      if(t.id==='catalog-search'){catalogSearch=t.value;refreshCatalog();return}
      if(t.id==='add-part'){showSuggest();return}
      if(t.id==='invoice-search'||t.id==='customer-search'){searchText=t.value;const pos=t.selectionStart;render();const n=document.getElementById(t.id);n?.focus();n?.setSelectionRange(pos,pos);return}
      if(t.closest('#line-items'))refreshTotals();
      if(t.name==='customerName'){const c=customerRows().find(c=>c.name.toLowerCase()===t.value.trim().toLowerCase());if(c){const f=t.form;[['customerPhone','phone'],['customerEmail','email'],['customerAddress','address'],['customerGstin','gstin']].forEach(([k,v])=>{if(!f[k].value&&c[v])f[k].value=c[v]})}}
    });
    document.addEventListener('keydown',e=>{const t=e.target;
      if(t.id==='add-part'){if(e.key==='ArrowDown'){e.preventDefault();moveSuggest(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveSuggest(-1)}else if(e.key==='Enter'){e.preventDefault();chooseSuggest(sgIndex)}else if(e.key==='Escape'&&t.value){e.preventDefault();e.stopPropagation();t.value='';showSuggest()}return}
      if(e.key==='Enter'&&t.tagName==='INPUT'&&t.form?.id==='invoice-form'){e.preventDefault();document.getElementById('add-part')?.focus();return}
      if(e.key==='Escape'&&document.querySelector('.modal-layer')){closeModal()}
    });
    document.addEventListener('change',async e=>{const t=e.target;
      if(t.id==='invoice-filter'){invoiceFilter=t.value;render();document.getElementById('invoice-filter').value=invoiceFilter;return}
      if(t.form?.id==='invoice-form'&&['inclusive','roundOff','gstType'].includes(t.name)){refreshTotals();return}
      if(t.id==='pricelist-file'){const file=t.files[0];if(!file)return;try{await importPriceList(file)}catch(err){toast(err?.message||'Could not read the spreadsheet. Try .xlsx or .csv.')}t.value='';return}
    });
    let afterSave='none';document.addEventListener('click',e=>{const b=e.target.closest('#invoice-form [type=submit]');if(b)afterSave=b.dataset.after},true);
    document.addEventListener('submit',e=>{
      if(e.target.id==='invoice-form'){e.preventDefault();const f=e.target;if(!f.reportValidity())return;const data=new FormData(f);const id=f.dataset.id;const old=id?db.invoices.find(x=>x.id===id):null;const items=[...document.querySelectorAll('#line-items .line-row')].map(readLine).filter(x=>x.description||x.partNumber).map(x=>({...x,description:x.description||x.partNumber}));if(!items.length){toast('Add at least one part or labour line.');document.getElementById('add-part').focus();return}
        const inv={...(old||{}),id:old?.id||uid(),number:old?.number||invNumber(),customerName:String(data.get('customerName')||'').trim(),customerPhone:String(data.get('customerPhone')||'').trim(),customerEmail:String(data.get('customerEmail')||'').trim(),customerAddress:String(data.get('customerAddress')||'').trim(),customerGstin:String(data.get('customerGstin')||'').trim().toUpperCase(),machineRef:String(data.get('machineRef')||'').trim(),date:data.get('date')||today(),dueDate:data.get('dueDate')||'',gstType:data.get('gstType')||'',inclusive:f.inclusive.checked,roundOff:f.roundOff.checked,notes:String(data.get('notes')||'').trim(),items,createdAt:old?.createdAt||new Date().toISOString()};
        if(!old&&f.paidNow?.checked){inv.paid=true;inv.paidAt=today()}
        if(old)db.invoices=db.invoices.map(x=>x.id===id?inv:x);else db.invoices.push(inv);save();closeModal();page='invoices';render();toast(old?'Bill updated.':`Bill ${inv.number} saved.`);if(afterSave==='print')printInvoice(inv.id);else showDetail(inv.id);return}
      if(e.target.id==='item-form'){e.preventDefault();const d=new FormData(e.target);db.catalog.push({id:uid(),partNumber:String(d.get('partNumber')||'').trim(),name:String(d.get('name')).trim(),brand:'',unit:'',kind:d.get('kind'),rate:num(d.get('rate')),taxRate:num(d.get('taxRate')),details:[]});save();render();toast('Item saved. It will show first when you search on a bill.');return}
      if(e.target.id==='settings-form'){e.preventDefault();const d=new FormData(e.target);db.settings={...db.settings,businessName:String(d.get('businessName')).trim(),tagline:String(d.get('tagline')).trim(),phone:String(d.get('phone')).trim(),email:String(d.get('email')).trim(),address:String(d.get('address')).trim(),taxId:String(d.get('taxId')).trim().toUpperCase(),taxRate:num(d.get('taxRate')),terms:String(d.get('terms')||'').trim(),mrpInclusive:d.get('mrpInclusive')==='on',roundOff:d.get('roundOff')==='on'};save();render();toast('Business details saved.')}
    });
    document.getElementById('restore-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.settings||!Array.isArray(d.invoices)||!Array.isArray(d.catalog))throw new Error('Invalid backup');db={...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings}};save();render();toast('Backup restored.')}catch{toast('Could not read that backup file.')}e.target.value=''});
    render();loadPriceList();
  })();
  </script>
